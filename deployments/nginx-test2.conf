# test2 本地网关: 镜像 k8s 的 istio VirtualService(gateway/route.yaml) 路径路由
# 作用: 给客户端提供单一入口, 按前缀把请求转发到各微服务容器(容器名:8080)
# 与 k8s 一致: 不做路径重写, 后端服务接收完整路径(如 /api/1.0/public/user_server/login)

worker_processes 1;
events { worker_connections 1024; }

http {
    # docker 内嵌 DNS, 使用变量 proxy_pass 在请求时解析, 避免容器启动顺序导致 nginx 启动失败
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket 升级支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # WebSocket 网关 -> gateway:12001 (客户端登录入口)
        location /ws {
            set $ws_backend "gateway:12001";
            proxy_pass http://$ws_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 公共 HTTP API 按前缀路由(与 route.yaml 一致)
        location /api/1.0/public/user_server/ {
            set $b "user-server:8080";
            proxy_pass http://$b$request_uri;
            proxy_set_header Host $host;
        }

        location /api/1.0/get/user_server/ {
            set $b "user-server:8080";
            proxy_pass http://$b$request_uri;
            proxy_set_header Host $host;
        }

        location /api/1.0/public/match_server/ {
            set $b "match-server:8080";
            proxy_pass http://$b$request_uri;
            proxy_set_header Host $host;
        }

        location /api/1.0/public/server_mgr/ {
            set $b "server-manager:8080";
            proxy_pass http://$b$request_uri;
            proxy_set_header Host $host;
        }

        location /api/1.0/public/route/ {
            set $b "route:8080";
            proxy_pass http://$b$request_uri;
            proxy_set_header Host $host;
        }

        location /api/1.0/public/auction/ {
            set $b "auction:8080";
            proxy_pass http://$b$request_uri;
            proxy_set_header Host $host;
        }

        location /api/1.0/public/item_manager/ {
            set $b "item-manager:8080";
            proxy_pass http://$b$request_uri;
            proxy_set_header Host $host;
        }

        location /api/1.0/public/homepage_server/ {
            set $b "homepage-server:8080";
            proxy_pass http://$b$request_uri;
            proxy_set_header Host $host;
        }

        location /api/1.0/public/ranking/ {
            set $b "ranking:8080";
            proxy_pass http://$b$request_uri;
            proxy_set_header Host $host;
        }

        # 兜底 -> user-server (与 route.yaml 默认路由一致)
        location / {
            set $b "user-server:8080";
            proxy_pass http://$b$request_uri;
            proxy_set_header Host $host;
        }
    }
}
